<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ledgerly — Create account</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="signup.js" defer></script></head><body><main class="auth-shell"><section class="card"><div class="eyebrow">Start tracking</div><h1 class="auth-title">Create your account</h1><p class="muted">Your transactions stay private to your account.</p><form id="signup-form" novalidate><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required autofocus><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required minlength="6"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" placeholder="Repeat your password" required minlength="6"><button id="btn-signup" type="submit">Create account</button></form><p id="msg" class="message" role="status" aria-live="polite"></p><p class="auth-switch muted">Already have an account? <a href="index.html">Sign in</a></p></section></main></body></html>

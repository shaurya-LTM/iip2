<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker – Login</title>
  <link rel="stylesheet" href="style.css">
  <!-- Load Supabase SDK first -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js" defer></script>
</head>
<body>
  <div class="card" id="login-card">
    <h2>Sign in</h2>

    <!-- STEP 1 – Email -->
    <div id="step-email">
      <input type="email" id="email" placeholder="Email" required>
      <button id="btn-email">Next</button>
    </div>

    <!-- STEP 2 – Password -->
    <div id="step-pass" style="display:none;">
      <input type="password" id="password" placeholder="Password" required>
      <button id="btn-pass">Next</button>
    </div>

    <!-- STEP 3 – Passkey (WebAuthn) -->
    <div id="step-passkey" style="display:none;">
      <p>Passkey authentication not required for this demo.</p>
    </div>

    <p id="msg" style="color:#f88;"></p>
  </div>
</body>
</html>

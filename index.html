<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ledgerly — Sign in</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="auth.js" defer></script></head><body><main class="auth-shell"><section class="card"><div class="eyebrow">Personal finance</div><h1 class="auth-title">Welcome back</h1><p class="muted">Sign in to see your money clearly.</p><form id="login-form" novalidate><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required autofocus><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password" required minlength="6"><button id="btn-login" type="submit">Sign in</button></form><p id="msg" class="message" role="status" aria-live="polite"></p><p class="auth-switch muted">New here? <a href="signup.html">Create an account</a></p></section></main></body></html>
